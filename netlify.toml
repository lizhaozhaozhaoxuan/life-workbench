[build]
  command = "npm run build"
  publish = "dist"

# 构建期环境变量：Vite 在构建时内联 import.meta.env.VITE_*。
# 由于 Netlify 是在其服务器上构建（而非读取本地 .env），必须把 Supabase 配置写在这里，
# 否则线上版会因读不到 VITE_SUPABASE_* 而静默降级为「本地模式」（无多端同步）。
# anon key 是前端公开密钥（已随客户端下发），由 RLS 保障数据安全，提交到仓库无风险。
[build.environment]
  NODE_VERSION = "22"
  VITE_SUPABASE_URL = "https://jvepeojgareopejdosvm.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2ZXBlb2pnYXJlb3BlamRvc3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTg4NTEsImV4cCI6MjEwMDczNDg1MX0.zWDdwjbOBs_77rO_lXXGQPONdMVwuAh9oBeCJcw5slM"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
